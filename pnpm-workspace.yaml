allowBuilds:
  '@prisma/client': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAge: 4320 # 3 days (in minutes)
minimumReleaseAgeExclude:
  - workerd
  - wrangler
  - miniflare
  - '@cloudflare/*'
overrides:
  '@better-fetch/fetch': 1.3.3 # @better-auth/infra pins 1.3.2, which breaks better-auth client types
